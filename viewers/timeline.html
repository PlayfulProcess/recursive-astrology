<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="../theme.css?v=3">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrology Timeline — Voices Through Time · Recursive Astrology</title>
<style>
  /* Colour tokens live in theme.css ONLY (see CLAUDE.md). This page declares no
     colours of its own — every fill/stroke below resolves to a var(). */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);color-scheme:light;
    font-family:Inter,system-ui,-apple-system,sans-serif}
  .wrap{display:flex;height:calc(100vh - 52px);min-height:0}
  #stage{flex:1;display:flex;flex-direction:column;min-width:0}
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
  .toolbar .title{font-weight:700;font-size:14px;margin-right:auto}
  .toolbar .title .sub{color:var(--muted);font-weight:400;font-size:12px}
  .toolbar button,.toolbar label{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .toolbar button:hover{border-color:var(--accent);color:var(--accent)}
  #scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
  svg{display:block;width:100%}
  .axis path,.axis line{stroke:var(--line)}
  .axis text{fill:var(--muted);font-size:11px}
  .gridline{stroke:var(--line);stroke-dasharray:2 4}
  .node{stroke:var(--bg);stroke-width:2px;cursor:pointer}
  /* Leader from the true year position to a dodged label — see draw(): the DOT
     never moves off its year, only the label is nudged, and this line admits it. */
  .leader{stroke:var(--line-soft);stroke-width:1px;fill:none}
  .dname{font-size:13.5px;fill:var(--ink);font-weight:600;cursor:pointer}
  .dyear{font-size:11px;fill:var(--grammar-accent-dark);font-weight:600}
  .rowg:hover .dname{fill:var(--accent)}
  .dim{opacity:.16}.hot{opacity:1!important}
  .legend{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;font-size:12px}
  .legend .row{display:flex;align-items:center;gap:6px;cursor:pointer}.legend .row.off{opacity:.35}
  .legend .sw{width:11px;height:11px;border-radius:3px}

  /* ── Undated lane ───────────────────────────────────────────────────────────
     Grammars with no historical anchor date are NOT plotted and NEVER given a
     stand-in year. They live here, below the axis, named as what they are. */
  #undated{padding:18px 16px 30px;border-top:1px dashed var(--line)}
  #undated h3{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--ink)}
  #undated .note{margin:0 0 14px;font-size:12px;line-height:1.55;color:var(--muted);max-width:62ch}
  #undated .grp{margin:0 0 14px}
  #undated .grp h4{margin:0 0 7px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  #undated .chips{display:flex;flex-wrap:wrap;gap:8px}
  #undated .chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;
    color:var(--ink);cursor:pointer;text-align:left;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
  #undated .chip:hover{border-color:var(--accent);color:var(--accent)}
  #undated .chip .cdot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  #undated .chip .cno{font-size:10.5px;font-weight:600;font-style:italic;color:var(--muted);white-space:nowrap}

  /* padding-bottom is 0 on purpose: the prev/next bar below is position:sticky
     bottom:0, which sticks to the bottom of the SCROLLPORT — with 18px of bottom
     padding, 18px of the card's text stayed visible in the gap underneath it, so
     a line of prose bled out below the footer. The footer supplies that spacing. */
  aside#detail{width:330px;max-width:84vw;background:var(--panel);border-left:1px solid var(--line);padding:18px 18px 0;overflow:auto;display:none;position:relative}
  aside#detail.open{display:block}
  aside#detail img{width:100%;max-height:240px;object-fit:contain;background:var(--thumb-bg);border-radius:8px;margin-bottom:4px}
  /* cover plate + its public-domain provenance (viewers/md.js → MD.credit) */
  aside#detail figure.cover{margin:0 0 12px}
  aside#detail figure.cover .md-credit{color:var(--muted);text-align:center}
  aside#detail h2{margin:.2em 0 .1em;font-size:18px;overflow-wrap:anywhere}
  aside#detail .when{color:var(--accent);font-size:13px;margin-bottom:2px}
  aside#detail .whence{color:var(--muted);font-size:11.5px;margin-bottom:10px}
  aside#detail .sec{margin:12px 0;font-size:13.5px;line-height:1.55;color:var(--ink)}
  aside#detail .sec h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  aside#detail .opencards{display:inline-block;margin-top:10px;padding:8px 14px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:600}
  /* Top-right X close — dark chip + white glyph, same visible-on-any-background
     pattern as viewers/cards.html's .modal-close (builder, Jul 7 2026: the old
     plain-text × disappeared over light panels / card images). */
  aside#detail .modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
    background:rgba(45,34,15,0.65);border:1px solid rgba(255,255,255,0.35);color:#fff;font-size:1.1rem;
    cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;transition:background .2s}
  aside#detail .modal-close:hover{background:rgba(255,255,255,0.2)}
  /* Prev/next deck paging — sticky footer bar at the bottom of the detail
     panel, same pattern as viewers/cards.html's .modal-nav-footer. */
  .modal-nav-footer{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;
    gap:1rem;margin:1.25rem -18px 0;padding:0.7rem 18px;background:var(--panel);border-top:1px solid var(--line)}
  .modal-nav-btn{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:rgba(47,93,138,.1);
    border:1px solid var(--line);color:var(--ink);font-size:1.2rem;cursor:pointer;display:flex;
    align-items:center;justify-content:center;transition:background .15s,opacity .15s}
  .modal-nav-btn:hover:not(:disabled){background:rgba(47,93,138,.35);border-color:var(--accent)}
  .modal-nav-btn:disabled{opacity:.3;cursor:default}
  .modal-counter{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);white-space:nowrap}
  #err{padding:40px;text-align:center;color:var(--bad)}

  /* Phone: a 330px sidebar inside a flex row squeezes the chart to nothing, so
     the detail panel becomes a bottom sheet instead (builder, Jul 26 2026). */
  @media (max-width:720px){
    aside#detail{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;max-width:100%;
      max-height:72vh;border-left:0;border-top:1px solid var(--line);z-index:60;
      box-shadow:var(--shadow-lift);border-radius:14px 14px 0 0}
    .modal-nav-footer{margin-left:-18px;margin-right:-18px}
  }

  /* embed mode: a clean book figure — no site chrome, no controls, no internal scroll */
  body.embed site-header, body.embed view-switcher, body.embed .lbl-descent{display:none}
  body.embed .wrap{height:auto;display:block}
  body.embed #stage{display:block}
  body.embed #scroll{overflow:visible;flex:none}
</style>
</head>
<body>
<script src="../site-header.js?v=47"></script>
<script src="../view-switcher.js?v=12"></script>
<site-header active="timeline"></site-header>
<div class="wrap">
  <div id="stage">
    <div class="toolbar">
      <div class="title">Astrology Timeline <span class="sub">— the dated voices, by branch</span></div>
      <view-switcher active="timeline"></view-switcher>
      <button id="flip">↑ Oldest first</button>
    </div>
    <div id="scroll"><svg id="svg"></svg><div id="undated"></div><div id="err" style="display:none"></div></div>
    <div class="legend" id="legend"></div>
  </div>
  <aside id="detail"></aside>
</div>

<script src="md.js?v=2"></script>
<script src="dimension-engine.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
// Branch colours mirror grammars/_collection.json's four curated branches (see
// scripts/build_collection.py) — NOT a genealogy: unlike tarot's decks, these
// grammars don't descend from one another, so there is no derives_from rail here.
const BRANCH_RAW={'primary-sources':'#2f5d8a','synthesis':'#3f7a5c','castings':'#b5651d','readings':'#6d8ec9'};
const BRANCH_LABEL={'primary-sources':'Primary sources','synthesis':'Synthesis','castings':'Castings','readings':'Readings'};
const PALETTE=['#2f5d8a','#3f7a5c','#b5651d','#6d8ec9','#9b6dc9','#c96d9b','#6b6457','#4db6ac','#e57373'];
const FALLBACK_HUE='#6b6457';

const params=new URLSearchParams(location.search);
const EMBED=params.get('embed');
if(EMBED) document.body.classList.add('embed');
function postHeight(){ if(!EMBED) return; try{ parent.postMessage({type:'astroEmbedHeight',h:Math.ceil(document.body.scrollHeight)},'*'); }catch(e){} }
if(EMBED) window.addEventListener('load',()=>setTimeout(postHeight,90));

// The CSS assumes a 52px <site-header>, but the real custom element renders
// taller (and can wrap to more lines on narrow phones) — a fixed calc(100vh -
// 52px) then makes .wrap taller than the actual remaining space, pushing the
// bottom of the detail panel (incl. the new prev/next footer) below the
// viewport. Measure the real header height instead of guessing.
function fitWrap(){
  if(EMBED) return; // embed mode sizes .wrap explicitly (see body.embed .wrap)
  const sh=document.querySelector('site-header');
  const h=(sh&&sh.offsetHeight)||52;
  document.querySelector('.wrap').style.height='calc(100vh - '+h+'px)';
}
fitWrap();
window.addEventListener('resize',fitWrap);
window.addEventListener('orientationchange',()=>setTimeout(fitWrap,200));

let itemMap={}, decks=[], undatedDecks=[], hidden=new Set(), oldestFirst=true, laneField='branch';
let currentPlaced=[]; // display order (chronological, then undated) for prev/next paging
let laneValues=[], colorOf={};   // set by buildLaneFromField()

// ── Honest year formatting ───────────────────────────────────────────────────
// The collection stores a signed sortable integer (-1000 = 1000 BCE). Printing
// that raw ("-1000", or d3's default "−1000") reads as a broken number, not a
// date. There is no year zero, so a 0 tick is dropped rather than labelled.
function fmtYear(y){
  if(y==null||!isFinite(y)) return '';
  if(y<0) return Math.abs(y)+' BCE';
  if(y<1000) return y+' CE';
  return String(y);
}

// Extract a field value from a deck for the current laneField
function laneOf(d){
  if(laneField==='branch') return d.branch||'—';
  return d[laneField]||d.meta?.[laneField]||'—';
}

// Build laneValues + colorOf from current decks + laneField. Lanes come from the
// DATED decks (they're the only ones with a position on the axis), but colours
// are assigned over dated + undated so the undated chips below share the legend.
function buildLaneFromField(){
  const vals=[...new Set(decks.map(laneOf).filter(v=>v&&v!=='—'))].sort(DimensionEngine.smartCmp);
  laneValues=vals.length?vals:['—'];
  const all=[...new Set([...laneValues,...undatedDecks.map(laneOf).filter(v=>v&&v!=='—')])].sort(DimensionEngine.smartCmp);
  colorOf={};
  all.forEach((v,i)=>{ colorOf[v]=laneField==='branch'?(BRANCH_RAW[v]||PALETTE[i%PALETTE.length]):PALETTE[i%PALETTE.length]; });
  colorOf['—']=FALLBACK_HUE;
}
// Every branch that has ANY grammar, dated or not — what the legend toggles.
function allLaneValues(){
  return [...new Set([...decks,...undatedDecks].map(laneOf).filter(v=>v&&v!=='—'))].sort(DimensionEngine.smartCmp);
}

(async function init(){
  try{
    const SRC='../grammars/_collection.json';
    const r=await fetch(SRC); if(!r.ok) throw new Error('Could not load '+SRC+' ('+r.status+')');
    const col=await r.json(); const grammars=(col.grammars||[]).filter(g=>!g.is_meta);
    const mk=g=>({
      id:g.slug,name:g.name,when:g.year_label||'',year:g.year==null?null:g.year,
      branch:g.branch,derives:[],image:g.cover_image_url,
      sections:{'Overview':g.blurb||''}
    });
    // Two honest groups, never one with a stand-in date. A grammar plots on the
    // axis only if the collection gives it a real historical anchor year (set in
    // scripts/build_collection.py's YEARS table). Everything else is real content
    // with no recorded date — it goes to the "Undated" lane below the axis and is
    // NEVER assigned a sentinel year to sort or plot it by.
    const all=grammars.map(mk);
    decks=all.filter(d=>d.year!=null);
    undatedDecks=all.filter(d=>d.year==null)
      .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
    undatedDecks.forEach(d=>{ d.sections={...d.sections,
      'Dating':'No historical anchor date is recorded for this grammar in the collection index, so it is deliberately not placed on the time axis. Undated here means "not dated in our data" — a contemporary synthesis, casting or reading, or a source whose date simply is not recorded yet. It does not mean the material is undatable.'}; });
    itemMap=Object.fromEntries(all.map(d=>[d.id,d]));
    // Lane by branch — the only field with more than one value here.
    laneField='branch';
  }catch(e){ document.getElementById('err').style.display='block'; document.getElementById('err').textContent=e.message; return; }
  buildLaneFromField(); buildLegend(); draw();
  window.addEventListener('resize',draw);
  // A window resize isn't the only thing that changes the chart's width — opening
  // the detail panel takes 330px off the stage with no resize event, which left
  // the SVG scaled down (tiny text) or its labels hidden behind the panel. Watch
  // the container itself. Width-only + debounced, so draw()'s height changes
  // can't feed back into a loop.
  if(window.ResizeObserver){
    let lastW=0, t=null;
    new ResizeObserver(entries=>{
      const w=Math.round(entries[0].contentRect.width);
      if(w===lastW||!w) return; lastW=w;
      clearTimeout(t); t=setTimeout(draw,60);
    }).observe(document.getElementById('scroll'));
  }
  document.getElementById('flip').addEventListener('click',()=>{ oldestFirst=!oldestFirst;
    document.getElementById('flip').textContent=oldestFirst?'↑ Oldest first':'↓ Newest first'; draw(); });
  document.addEventListener('keydown',(e)=>{
    if(!document.getElementById('detail').classList.contains('open')) return;
    if(e.key==='Escape'){ document.getElementById('detail').classList.remove('open'); }
    if(e.key==='ArrowLeft') navigateDeck(-1);
    if(e.key==='ArrowRight') navigateDeck(1);
  });
})();

function visible(){ return decks.filter(d=>!hidden.has(laneOf(d))); }
function visibleUndated(){ return undatedDecks.filter(d=>!hidden.has(laneOf(d))); }
// Display name: drop the "— subtitle" tail and any parenthetical, keep the rest
// WHOLE. Any shortening after this point is measured against the real pixel
// width available and marked with a real ellipsis (see fitNames).
function displayName(d){ return String(d.name||d.id).replace(/\s+[—–-]\s+.*/,'').replace(/\s*\([^)]*\)/g,'').trim()||String(d.id); }

function draw(){
  const scroll=document.getElementById('scroll');
  const W=Math.max(320, scroll.clientWidth||900);
  const narrow=W<560;
  const data=visible();
  const svg=d3.select('#svg');
  drawUndated();
  if(!data.length){ svg.selectAll('*').remove(); svg.attr('height',0); currentPlaced=visibleUndated().slice(); postHeight(); return; }

  const years=d3.extent(data,d=>d.year);
  const span=Math.max(1, years[1]-years[0]);
  // Strictly LINEAR px-per-year (blank space still equals real elapsed time),
  // but capped so a 3,000-year span doesn't produce a 5,600px scroll for four
  // points. Proportionality is preserved; only the zoom level adapts.
  const PXY=Math.min(1.9, Math.max(0.08, 1500/span));
  const padTop=42, padBot=40;
  const axisW=narrow?64:76;                        // fits "1000 BCE", not just "−1000"
  const innerH=Math.max(360, span*PXY);
  const H=padTop+innerH+padBot;
  const y=d3.scaleLinear().domain(years).range(oldestFirst?[padTop,padTop+innerH]:[padTop+innerH,padTop]);
  const lanes=laneValues.filter(v=>!hidden.has(v));
  // On a phone, side-by-side lanes leave ~180px per column — too narrow to read a
  // grammar's name. Collapse to a single column there; branch is still carried by
  // the node colour, which the legend below spells out.
  const collapsed=narrow&&lanes.length>1;
  const cols=collapsed?1:Math.max(1,lanes.length);
  const laneW=(W-axisW-8)/cols;
  const indent=cols>1?Math.min(28,laneW*0.12):14;
  const laneCol=v=>cols===1?0:Math.max(0,lanes.indexOf(v));
  const laneX=v=>axisW + laneCol(v)*laneW + indent;

  svg.attr('viewBox',[0,0,W,H]).attr('height',H); svg.selectAll('*').remove();

  // year gridlines + axis (proportional → blank space = real time gaps)
  const nTicks=Math.min(14, Math.max(4, Math.round(span/45)));
  const ticks=y.ticks(nTicks).filter(t=>t!==0);    // there is no year zero
  svg.append('g').selectAll('line').data(ticks).join('line').attr('class','gridline')
    .attr('x1',axisW).attr('x2',W-8).attr('y1',d=>y(d)).attr('y2',d=>y(d));
  svg.append('g').attr('class','axis').attr('transform',`translate(${axisW},0)`)
    .call(d3.axisLeft(y).tickValues(ticks).tickFormat(fmtYear));
  // lane headers (discovered field values) — full label, never a chopped word.
  // Suppressed only in the collapsed single-column phone layout, where one header
  // would falsely label a column holding several branches.
  if(!collapsed){
    svg.append('g').selectAll('text').data(lanes).join('text')
      .attr('x',v=>laneX(v)-indent+4).attr('y',20).attr('fill',v=>colorOf[v]||FALLBACK_HUE)
      .style('font-size','11px').style('font-weight','700')
      .text(v=>(laneField==='branch'?(BRANCH_LABEL[v]||v):v).replace(/\s*\(.*\)/,''));
    svg.append('g').selectAll('rect').data(lanes).join('rect')   // faint lane tint
      .attr('x',v=>axisW+lanes.indexOf(v)*laneW).attr('y',padTop-8).attr('width',laneW-2).attr('height',innerH+16)
      .attr('fill',v=>colorOf[v]||FALLBACK_HUE).attr('opacity',0.04);
  }

  // Label collision: the DOT stays on its true year (ty) — only the LABEL is
  // dodged (ly), within its own lane, and a leader line connects the two so the
  // nudge is visible rather than silently mis-stating the date.
  // Either sort direction walks the points in VISUAL top-to-bottom order (the y
  // range flips with it), so the nudge is always downward — the old
  // `oldestFirst?1:-1` pushed "newest first" labels off the top of the chart.
  const minGap=21, laneLast={}; const placed=[];
  data.slice().sort((a,b)=>oldestFirst?a.year-b.year:b.year-a.year).forEach(d=>{
    const lv=laneOf(d);
    const key=cols===1?'*':lv;      // collapsed layout dodges across all points
    const ty=y(d.year); let ly=ty;
    if(laneLast[key]!=null && ly-laneLast[key]<minGap) ly=laneLast[key]+minGap;
    laneLast[key]=ly;
    const px=laneX(lv);
    const avail=(cols>1?Math.min(laneW-indent-16, W-px-24):W-px-24);
    placed.push({...d, lv, px, ty, ly, avail:Math.max(48,avail)});
  });

  const g=svg.append('g').selectAll('g.rowg').data(placed).join('g').attr('class','rowg')
    .attr('transform',d=>`translate(${d.px},${d.ty})`);
  g.append('title').text(d=>displayName(d)+' — '+(d.when||fmtYear(d.year)));
  g.filter(d=>Math.abs(d.ly-d.ty)>1).append('path').attr('class','leader')
    .attr('d',d=>`M6 0 L10 ${(d.ly-d.ty).toFixed(1)}`);
  g.append('circle').attr('class','node').attr('r',6).attr('fill',d=>colorOf[d.lv]||FALLBACK_HUE);
  const dn=g.append('text').attr('class','dname').attr('x',12).attr('y',d=>d.ly-d.ty).attr('dy','0.32em');
  dn.append('tspan').attr('class','dn-name').text(d=>displayName(d));
  dn.append('tspan').attr('class','dyear').attr('dx','7').text(d=>fmtYear(d.year));
  fitNames(dn);

  g.on('click',(ev,d)=>{ev.stopPropagation();showDetail(d);})
   .on('mouseenter',(ev,d)=>trace(d.id,g))
   .on('mouseleave',()=>{g.classed('dim',false).classed('hot',false);});

  // A dense cluster can dodge the last label past the nominal bottom — grow the
  // canvas to fit it rather than clipping the name off.
  const maxLy=placed.reduce((m,p)=>Math.max(m,p.ly),padTop);
  if(maxLy+padBot>H){ const H2=Math.ceil(maxLy+padBot); svg.attr('viewBox',[0,0,W,H2]).attr('height',H2); }

  // Prev/next pages the dated points in drawn order, then the undated lane.
  currentPlaced=placed.concat(visibleUndated());
  svg.on('click',()=>document.getElementById('detail').classList.remove('open'));
  postHeight();
}

// Measure each name against the pixel width actually available and, only if it
// genuinely doesn't fit, trim it at a whole word with a real ellipsis. Binary
// search on getComputedTextLength — exact, unlike a fixed .slice(0,30). The full
// name always survives in the <title> tooltip and in the detail card.
function fitNames(dn){
  dn.each(function(d){
    const nameT=d3.select(this).select('tspan.dn-name');
    const yearT=d3.select(this).select('tspan.dyear');
    const node=nameT.node(); if(!node||!node.getComputedTextLength) return;
    const yearW=(yearT.node()&&yearT.node().getComputedTextLength?yearT.node().getComputedTextLength():0)+9;
    const avail=Math.max(36, d.avail-yearW);
    const full=displayName(d);
    if(node.getComputedTextLength()<=avail) return;
    let lo=1, hi=full.length;
    while(lo<hi){
      const mid=Math.ceil((lo+hi)/2);
      nameT.text(full.slice(0,mid).replace(/\s+$/,'')+'…');
      if(node.getComputedTextLength()<=avail) lo=mid; else hi=mid-1;
    }
    // back off to a word boundary so we never end mid-word ("Ptolemy's Tetrab"),
    // then drop any dangling punctuation so it can't read as "Ptolemy'…"
    let cut=full.slice(0,lo);
    const sp=cut.lastIndexOf(' ');
    if(sp>=6 && lo<full.length) cut=cut.slice(0,sp);
    cut=cut.replace(/[\s'’‘"“”\-–—,.:;&]+$/,'');
    nameT.text((cut||full.slice(0,1))+'…');
  });
}

// ── the undated lane ─────────────────────────────────────────────────────────
function drawUndated(){
  const host=document.getElementById('undated');
  const list=visibleUndated();
  if(!list.length){ host.innerHTML=''; return; }
  const groups={};
  list.forEach(d=>{ const lv=laneOf(d); (groups[lv]=groups[lv]||[]).push(d); });
  const order=Object.keys(groups).sort(DimensionEngine.smartCmp);
  let h=`<h3>Undated — ${list.length} grammar${list.length===1?'':'s'} with no anchor date</h3>
    <p class="note">These carry no historical anchor date in the collection index, so they are
    <strong>not</strong> placed on the axis above and are given no stand-in year. Most are contemporary
    syntheses, castings and readings; where a primary source appears here, its date simply isn't recorded
    in our data yet. Click any one to read it.</p>`;
  // Two grammar directories can carry the same name (there are such pairs in the
  // collection today). Don't silently merge them — that would hide a real data
  // problem — but do show the slug so the reader can tell them apart.
  const nameCount={};
  list.forEach(d=>{ const n=displayName(d); nameCount[n]=(nameCount[n]||0)+1; });
  for(const lv of order){
    const hue=colorOf[lv]||FALLBACK_HUE;
    const label=laneField==='branch'?(BRANCH_LABEL[lv]||lv):lv;
    h+=`<div class="grp"><h4 style="color:${hue}">${esc(label)}</h4><div class="chips">`;
    h+=groups[lv].map(d=>{
      const n=displayName(d);
      const dupe=nameCount[n]>1?` <span class="cno">${esc(d.id)}</span>`:'';
      return `<button class="chip" data-slug="${esc(d.id)}" title="${esc(d.name||d.id)} — no date recorded (grammars/${esc(d.id)})">
      <span class="cdot" style="background:${hue}"></span><span>${esc(n)}</span>${dupe}
      <span class="cno">no date recorded</span></button>`;}).join('');
    h+=`</div></div>`;
  }
  host.innerHTML=h;
  host.querySelectorAll('.chip').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const d=itemMap[b.dataset.slug]; if(d) showDetail(d);
  });
}

function trace(id,g){
  const keep=new Set([id]); const stack=[id];
  while(stack.length){ const x=stack.pop(); (itemMap[x]?.metadata?.derives_from||[]).forEach(s=>{ if(!keep.has(s)){keep.add(s);stack.push(s);} }); }
  g.classed('dim',d=>!keep.has(d.id)).classed('hot',d=>keep.has(d.id));
}

// The ONE shared renderer (viewers/md.js) — this page used to carry its own
// **bold**-only two-liner, which is exactly the drift md.js was made to end.
function mdToHtml(s){ return MD.toHtml(s); }

/* ── late-bound grammar detail ────────────────────────────────────────────────
   The chart is built from grammars/_collection.json, which is deliberately small:
   it carries a CLIPPED blurb (it ends mid-word in a "…") and no image credit at
   all. Rendering that clipped blurb as the panel's whole "Overview" made the
   library look like it stops mid-sentence, and the cover plate appeared with no
   sourcing even though the grammar file records it. So: fetch the one grammar
   file the reader actually opened — never all nineteen — and fill in the real
   description and the plate's provenance. Cached per slug; failures are silent
   and simply leave the collection's own values in place. */
const grammarDetail = {};
async function enrichDeck(d){
  if (!d || !d.id || grammarDetail[d.id] !== undefined) return grammarDetail[d.id];
  grammarDetail[d.id] = null;             // in-flight marker: never fetch twice
  try{
    const r = await fetch(`../grammars/${encodeURIComponent(d.id)}/grammar.json`);
    if (!r.ok) throw new Error(r.status);
    const g = await r.json();
    grammarDetail[d.id] = { description: g.description || '', credit: g.cover_image_credit || null };
  }catch(e){ grammarDetail[d.id] = null; }
  return grammarDetail[d.id];
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function navigateDeck(direction){
  if(!currentPlaced.length) return;
  const curId=(document.getElementById('detail').dataset||{}).deckId;
  const currentIndex=currentPlaced.findIndex(p=>p.id===curId);
  if(currentIndex===-1) return;
  const newIndex=Math.max(0,Math.min(currentPlaced.length-1,currentIndex+direction));
  if(newIndex!==currentIndex) showDetail(currentPlaced[newIndex]);
}
function showDetail(d){
  const el=document.getElementById('detail'); const slug=d.id;
  el.dataset.deckId=d.id;
  const extra = grammarDetail[d.id] || null;
  let html=`<span class="modal-close" onclick="document.getElementById('detail').classList.remove('open')" title="Close" aria-label="Close">&times;</span>`;
  if(d.image) html+=`<figure class="cover">`
    + `<img src="${esc(d.image)}" alt="${esc(d.name)}" loading="lazy">`
    + (extra ? MD.credit(extra.credit) : '')
    + `</figure>`;
  // Full name — never the truncated axis label.
  html+=`<h2>${esc(d.name)}</h2>`;
  // The date line states only what the data holds: the curated label if there is
  // one, else the plain year, else an explicit "no date recorded".
  const when = d.when ? d.when : (d.year!=null ? fmtYear(d.year) : 'No date recorded');
  html+=`<div class="when">${esc(when)}</div>`;
  const branchLabel=laneField==='branch'?(BRANCH_LABEL[laneOf(d)]||laneOf(d)):laneOf(d);
  html+=`<div class="whence">${esc(branchLabel)} · grammars/${esc(slug)}</div>`;
  for(const [k,v] of Object.entries(d.sections)){
    // Prefer the grammar's own full description over the collection's clipped
    // blurb, once the grammar file has arrived (see enrichDeck).
    const body = (k==='Overview' && extra && extra.description) ? extra.description : v;
    if(body) html+=`<div class="sec"><h4>${esc(k)}</h4>${mdToHtml(String(body))}</div>`;
  }
  if(slug) html+=`<a class="opencards" href="cards.html?src=${encodeURIComponent('../grammars/'+slug+'/grammar.json')}">Open ${esc(d.name.replace(/\s+[—–-].*/,''))} cards →</a>`;
  // Prev/next footer — pages the dated points in the order the axis draws them,
  // then continues through the undated lane.
  const idx=currentPlaced.findIndex(p=>p.id===d.id), total=currentPlaced.length;
  if(total>1 && idx!==-1){
    html+=`<div class="modal-nav-footer">
      <button class="modal-nav-btn" onclick="navigateDeck(-1)" ${idx<=0?'disabled':''} title="Previous grammar (←)" aria-label="Previous grammar">&#8592;</button>
      <span class="modal-counter">${idx+1} of ${total}</span>
      <button class="modal-nav-btn" onclick="navigateDeck(1)" ${idx>=total-1?'disabled':''} title="Next grammar (→)" aria-label="Next grammar">&#8594;</button>
    </div>`;
  }
  el.innerHTML=html; el.classList.add('open');
  // First open of a grammar: pull its file, then repaint THIS card if it is still
  // the one on screen (a fast click-through must not overwrite a later card).
  if(grammarDetail[d.id]===undefined){
    enrichDeck(d).then(got=>{ if(got && el.dataset.deckId===d.id) showDetail(d); });
  }
}
function buildLegend(){
  const lg=document.getElementById('legend'); lg.innerHTML='';
  allLaneValues().forEach(v=>{ const row=document.createElement('div'); row.className='row'+(hidden.has(v)?' off':'');
    const label=laneField==='branch'?(BRANCH_LABEL[v]||v):v;
    row.innerHTML=`<span class="sw" style="background:${colorOf[v]||FALLBACK_HUE}"></span><span>${esc(label)}</span>`;
    row.onclick=()=>{hidden.has(v)?hidden.delete(v):hidden.add(v);buildLegend();draw();}; lg.appendChild(row); });
}
</script>
